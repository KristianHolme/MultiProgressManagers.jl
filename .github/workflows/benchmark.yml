name: Benchmark this PR
on:
  # `pull_request` (not `pull_request_target`) so this workflow file from the
  # PR branch is what runs. Same-repo PRs can still post comments with the
  # `pull-requests: write` permission below. Fork PRs would need
  # `pull_request_target` because `GITHUB_TOKEN` is read-only for those events.
  pull_request:
    branches: [master]

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: "1.12"
          # Default `job-summary: false` posts a PR comment via
          # peter-evans/create-or-update-comment. Setting it to true would
          # write only to the Actions job summary instead.
          exeflags: "--threads=auto"
          # Freeze the PR's suite so script changes are compared
          # apples-to-apples across revisions.
          bench-on: ${{ github.event.pull_request.head.sha }}
