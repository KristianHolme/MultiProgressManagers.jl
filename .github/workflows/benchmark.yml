name: Benchmark this PR
on:
  pull_request:
    branches: [master]

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: "1.12"
          job-summary: "true"
          exeflags: "--threads=auto"
          # Freeze the PR's suite so this workflow works before
          # `benchmark/benchmarks.jl` exists on master, and so script
          # changes are compared apples-to-apples across revisions.
          bench-on: ${{ github.event.pull_request.head.sha }}
